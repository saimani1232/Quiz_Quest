<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <title>Dice Challenge</title>
  </head>
  <body>
    <div class="game-container">
      <div class="header">
        <h1>Dice Challenge</h1>
        <p class="game-rules">First to reach 100 points wins! Roll a 1 and lose your turn.</p>
      </div>
      
      <main>
        <section class="player player--0 player--active">
          <div class="player-content">
            <h2 class="name" id="name--0">Player 1</h2>
            <div class="score-box">
              <p class="score" id="score--0">0</p>
              <span class="score-label">Total</span>
            </div>
            <div class="current">
              <p class="current-label">Current</p>
              <p class="current-score" id="current--0">0</p>
            </div>
          </div>
        </section>

        <div class="game-controls">
          <div class="dice-container">
            <img src="dice-6.png" alt="Playing dice" class="dice" />
          </div>
          
          <div class="buttons">
            <button class="btn btn--new"><i class="fas fa-sync-alt"></i> New Game</button>
            <button class="btn btn--roll"><i class="fas fa-dice"></i> Roll Dice</button>
            <button class="btn btn--hold"><i class="fas fa-hand-paper"></i> Hold</button>
          </div>
        </div>

        <section class="player player--1">
          <div class="player-content">
            <h2 class="name" id="name--1">Player 2</h2>
            <div class="score-box">
              <p class="score" id="score--1">0</p>
              <span class="score-label">Total</span>
            </div>
            <div class="current">
              <p class="current-label">Current</p>
              <p class="current-score" id="current--1">0</p>
            </div>
          </div>
        </section>
      </main>
      
      <div class="winner-message hidden">
        <div class="winner-content">
          <h2 id="winner-text">Player 1 Wins!</h2>
          <button class="btn btn--new-after-win"><i class="fas fa-sync-alt"></i> Play Again</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
