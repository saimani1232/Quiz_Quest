<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <title>Guess My Number!</title>
  </head>
  <body>
    <div class="game-container">
      <header>
        <div class="header-content">
          <button class="btn again">
            <i class="fas fa-redo-alt"></i> Play Again
          </button>
          <div class="title-container">
            <h1>Guess My Number!</h1>
            <p class="between">(Between 1 and 20)</p>
          </div>
          <div class="number-container">
            <div class="number">?</div>
            <div class="number-shadow"></div>
          </div>
        </div>
      </header>
      
      <main>
        <section class="left">
          <div class="input-container">
            <input type="number" class="guess" placeholder="?" min="1" max="20" />
            <button class="btn check">
              <i class="fas fa-search"></i> Check!
            </button>
          </div>
        </section>
        
        <section class="right">
          <div class="message-box">
            <p class="message">Start guessing...🙌</p>
          </div>
          <div class="stats">
            <p class="label-score">
              <i class="fas fa-star"></i> Score: <span class="score">20</span>
            </p>
            <p class="label-highscore">
              <i class="fas fa-trophy"></i> Highscore: <span class="highscore">0</span>
            </p>
          </div>
        </section>
      </main>
    </div>
    
    <script src="script.js"></script>
  </body>
</html>
